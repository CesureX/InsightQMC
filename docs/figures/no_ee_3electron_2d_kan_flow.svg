  <text x="1240" y="520" class="math">Ψ = det(A)</text>

  <!-- No cross-electron sum warning -->
  <rect x="1218" y="585" width="252" height="165" rx="8" class="badBox"/>
  <text x="1240" y="620" class="section">这里不会发生</text>
