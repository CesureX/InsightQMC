<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30404f"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#668099"/>
    </marker>
    <style>
      text {
        font-family: "Noto Sans CJK SC", "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
        fill: #17212b;
      }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #4d5b68; }
      .section { font-size: 20px; font-weight: 700; fill: #203040; }
      .small { font-size: 15px; fill: #51606e; }
      .tiny { font-size: 13px; fill: #5e6b76; }
      .math { font-family: "Times New Roman", "Noto Serif CJK SC", serif; font-size: 18px; fill: #111820; }
      .laneLabel { font-size: 18px; font-weight: 700; fill: #25313d; }
      .nodeText { font-family: "Times New Roman", serif; font-size: 18px; fill: #111820; }
      .sumText { font-family: "Times New Roman", serif; font-size: 24px; font-weight: 700; fill: #111820; }
      .edgeLabel { font-family: "Times New Roman", serif; font-size: 14px; fill: #40556a; }
      .lane { fill: #f7fafc; stroke: #d7e0e8; stroke-width: 1.5; }
      .inputNode { fill: #fefefe; stroke: #2f5d7c; stroke-width: 2.2; }
      .sumNode { fill: #fff8e8; stroke: #c07b22; stroke-width: 2.2; }
      .hiddenNode { fill: #eef7ff; stroke: #2f6f9f; stroke-width: 2.2; }
      .outputNode { fill: #f0fbf5; stroke: #2f8b57; stroke-width: 2.2; }
      .matrixCell { fill: #ffffff; stroke: #7b8a99; stroke-width: 1.4; }
      .noteBox { fill: #fffdf7; stroke: #e0b65f; stroke-width: 1.4; }
      .badBox { fill: #fff5f5; stroke: #d96b6b; stroke-width: 1.4; }
      .layerBand { fill: #edf3f8; stroke: #c7d4df; stroke-width: 1.4; }
      .line { stroke: #30404f; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .softLine { stroke: #668099; stroke-width: 1.35; fill: none; marker-end: url(#arrowSoft); }
      .noArrow { stroke: #668099; stroke-width: 1.2; fill: none; }
      .brace { stroke: #6d7c8b; stroke-width: 2.2; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="980" fill="#ffffff"/>

  <text x="64" y="60" class="title">不加入电子-电子信息时的 KAN 连接图</text>
  <text x="64" y="92" class="subtitle">二维 3 电子示例：每个电子只输入自己的 hᵢ=[rᵢ,xᵢ,yᵢ]；共享 KAN 参数；电子维度一直保留到 determinant。</text>

  <rect x="60" y="125" width="1480" height="70" rx="8" class="noteBox"/>
  <text x="88" y="154" class="section">关键规则</text>
  <text x="88" y="181" class="small">KAN 层求和发生在同一个电子行内部：输入特征 → 隐藏节点、隐藏节点 → orbital。不会把电子 1、2、3 的同一列相加。</text>

  <rect x="80" y="230" width="330" height="590" rx="8" class="layerBand"/>
  <text x="150" y="262" class="section">输入特征</text>
  <text x="118" y="288" class="small">每行是一个电子</text>

  <rect x="455" y="230" width="305" height="590" rx="8" class="layerBand"/>
  <text x="510" y="262" class="section">KAN 第 1 层：3 → 2</text>
  <text x="492" y="288" class="small">边函数 φ 后求和</text>

  <rect x="805" y="230" width="355" height="590" rx="8" class="layerBand"/>
  <text x="870" y="262" class="section">KAN 第 2 层：2 → 3</text>
  <text x="846" y="288" class="small">边函数 ψ 后求和</text>

  <rect x="1205" y="230" width="295" height="590" rx="8" class="layerBand"/>
  <text x="1260" y="262" class="section">orbital 矩阵</text>
  <text x="1232" y="288" class="small">行=电子，列=orbital</text>

  <!-- Lane backgrounds -->
  <rect x="100" y="320" width="1380" height="120" rx="8" class="lane"/>
  <rect x="100" y="495" width="1380" height="120" rx="8" class="lane"/>
  <rect x="100" y="670" width="1380" height="120" rx="8" class="lane"/>

  <text x="122" y="349" class="laneLabel">电子 1</text>
  <text x="122" y="524" class="laneLabel">电子 2</text>
  <text x="122" y="699" class="laneLabel">电子 3</text>

  <!-- Electron 1 inputs -->
  <circle cx="220" cy="335" r="19" class="inputNode"/>
  <circle cx="220" cy="380" r="19" class="inputNode"/>
  <circle cx="220" cy="425" r="19" class="inputNode"/>
  <text x="213" y="341" class="nodeText">r₁</text>
  <text x="212" y="386" class="nodeText">x₁</text>
  <text x="212" y="431" class="nodeText">y₁</text>

  <!-- Electron 2 inputs -->
  <circle cx="220" cy="510" r="19" class="inputNode"/>
  <circle cx="220" cy="555" r="19" class="inputNode"/>
  <circle cx="220" cy="600" r="19" class="inputNode"/>
  <text x="213" y="516" class="nodeText">r₂</text>
  <text x="212" y="561" class="nodeText">x₂</text>
  <text x="212" y="606" class="nodeText">y₂</text>

  <!-- Electron 3 inputs -->
  <circle cx="220" cy="685" r="19" class="inputNode"/>
  <circle cx="220" cy="730" r="19" class="inputNode"/>
  <circle cx="220" cy="775" r="19" class="inputNode"/>
  <text x="213" y="691" class="nodeText">r₃</text>
  <text x="212" y="736" class="nodeText">x₃</text>
  <text x="212" y="781" class="nodeText">y₃</text>

  <!-- Electron 1 layer 1 sums and hidden -->
  <circle cx="535" cy="352" r="21" class="sumNode"/>
  <circle cx="535" cy="408" r="21" class="sumNode"/>
  <text x="525" y="360" class="sumText">Σ</text>
  <text x="525" y="416" class="sumText">Σ</text>
