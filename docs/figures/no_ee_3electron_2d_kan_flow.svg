  <circle cx="900" cy="515" r="20" class="sumNode"/>
  <circle cx="900" cy="555" r="20" class="sumNode"/>
  <circle cx="900" cy="595" r="20" class="sumNode"/>
  <text x="891" y="522" class="sumText">Σ</text>
  <text x="891" y="562" class="sumText">Σ</text>
  <text x="891" y="602" class="sumText">Σ</text>
  <circle cx="1040" cy="515" r="24" class="outputNode"/>
  <circle cx="1040" cy="555" r="24" class="outputNode"/>
  <circle cx="1040" cy="595" r="24" class="outputNode"/>
  <text x="1024" y="521" class="nodeText">Y₂₁</text>
  <text x="1024" y="561" class="nodeText">Y₂₂</text>
  <text x="1024" y="601" class="nodeText">Y₂₃</text>

  <!-- Layer 2 sums and outputs, e3 -->
  <circle cx="900" cy="690" r="20" class="sumNode"/>
  <circle cx="900" cy="730" r="20" class="sumNode"/>
  <circle cx="900" cy="770" r="20" class="sumNode"/>
  <text x="891" y="697" class="sumText">Σ</text>
  <text x="891" y="737" class="sumText">Σ</text>
  <text x="891" y="777" class="sumText">Σ</text>
  <circle cx="1040" cy="690" r="24" class="outputNode"/>
  <circle cx="1040" cy="730" r="24" class="outputNode"/>
  <circle cx="1040" cy="770" r="24" class="outputNode"/>
