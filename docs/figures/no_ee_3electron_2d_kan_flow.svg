  <text x="82" y="884" class="math">zᵢₐ = Σₚ φₐₚ(hᵢₚ)</text>
  <text x="82" y="920" class="math">Yᵢₖ = Σₐ ψₖₐ(zᵢₐ)</text>
  <text x="270" y="920" class="tiny">i 不参与求和</text>
</svg>
