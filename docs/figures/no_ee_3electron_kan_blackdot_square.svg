  <text x="60" y="58" class="title">KAN black-dot / square diagram: no electron-electron aggregation</text>
  <text x="60" y="90" class="sub">Example: 3 electrons, each electron input is h_i=[r_i,x_i,y_i], shared KAN 3 -> 2 -> 3.</text>

