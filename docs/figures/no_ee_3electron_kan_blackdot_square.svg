  <text x="1224" y="718" class="label">Layer formulas</text>
  <text x="1224" y="756" class="math">z_i1 = phi_11(r_i) + phi_12(x_i) + phi_13(y_i)</text>
  <text x="1224" y="786" class="math">z_i2 = phi_21(r_i) + phi_22(x_i) + phi_23(y_i)</text>
  <text x="1224" y="827" class="math">Y_ik = psi_k1(z_i1) + psi_k2(z_i2)</text>
  <text x="1224" y="858" class="small">i is electron index; no summation over i inside KAN layers.</text>
