  <rect x="305" y="134" width="24" height="24" class="square"/>
  <text x="345" y="154" class="small">square = one edge function phi or psi</text>
  <text x="84" y="178" class="small">Every electron lane uses the same parameters, but no lines go between electron lanes.</text>

  <rect x="1180" y="120" width="455" height="68" rx="8" class="bad"/>
  <text x="1204" y="150" class="label">Not this:</text>
  <text x="1295" y="150" class="math">z11 + z21 + z31</text>
  <text x="1295" y="176" class="math">z12 + z22 + z32</text>
  <text x="1485" y="163" class="small">no cross-electron sum</text>

